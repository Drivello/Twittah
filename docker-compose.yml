version: "3.8"

services:
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
    volumes:
      - ./scripts/init-topics.sh:/init-topics.sh:ro
    command: ["sh", "-c", "sleep 10 && bash /init-topics.sh && /opt/bitnami/scripts/kafka/entrypoint.sh /run.sh"]
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s


  postgres-auth:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
      - ./scripts/auth:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: user
    ports:
      - "5434:5432"
    volumes:
      - pgdata-user:/var/lib/postgresql/data
      - ./scripts/user:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./services/gateway
    environment:
      KAFKA_BROKERS: "kafka:9092"
      GATEWAY_PORT: 8081
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./services/auth
    environment:
      POSTGRES_DSN: "host=postgres-auth user=auth password=auth dbname=auth sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
      AUTH_SERVICE_PORT: 8082
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  user:
    build:
      context: ./services/user
    environment:
      POSTGRES_DSN: "host=postgres-user user=user password=user dbname=user sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
      USER_SERVICE_PORT: 8083
    depends_on:
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"

  postgres-tweet:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: tweet
      POSTGRES_PASSWORD: tweet
      POSTGRES_DB: tweet
    ports:
      - "5435:5432"
    volumes:
      - pgdata-tweet:/var/lib/postgresql/data
      - ./scripts/tweet:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tweet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-tweet:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redisdata-tweet:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  tweet:
    build:
      context: ./services/tweet
    env_file:
      - ./services/tweet/.env-example
    environment:
      POSTGRES_DSN: "host=postgres-tweet user=tweet password=tweet dbname=tweet sslmode=disable"
      REDIS_ADDR: "redis-tweet:6379"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_GROUP_ID: "tweet-service-group"
      SERVICE_PORT: 8084
      TIMELINE_TTL_HOURS: 24
    depends_on:
      postgres-tweet:
        condition: service_healthy
      redis-tweet:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"

volumes:
  pgdata-auth:
  pgdata-user:
  pgdata-tweet:
  redisdata-tweet:
