version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092" # para la red Docker
      - "29092:29092" # para acceder desde tu host
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.coordinator=WARN,kafka.network=ERROR"
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres-auth:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5433:5432"
    volumes:
      - pgdata-auth:/var/lib/postgresql/data
      - ./initdb/auth:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-user:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: user
    ports:
      - "5434:5432"
    volumes:
      - pgdata-user:/var/lib/postgresql/data
      - ./initdb/user:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./services/gateway
    environment:
      KAFKA_BROKERS: "kafka:9092"
      GATEWAY_PORT: 8081
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"

  auth:
    build:
      context: ./services/auth
    environment:
      POSTGRES_DSN: "host=postgres-auth user=auth password=auth dbname=auth sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
      AUTH_SERVICE_PORT: 8082
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"

  user:
    build:
      context: ./services/user
    environment:
      POSTGRES_DSN: "host=postgres-user user=user password=user dbname=user sslmode=disable"
      KAFKA_BROKERS: "kafka:9092"
      USER_SERVICE_PORT: 8083
    depends_on:
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"

volumes:
  pgdata-auth:
  pgdata-user:
